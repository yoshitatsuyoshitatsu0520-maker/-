<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>ROD CLICKER</title>
<style>
:root{color-scheme:light;--ink:#20242b;--muted:#858b96;--line:#e8ebef;--blue:#3978f6;--pale:#f4f7ff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#fff;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:grid;place-items:center;padding:24px}
main{width:min(100%,520px);text-align:center}
.mark{width:58px;height:58px;border-radius:19px;background:var(--pale);color:var(--blue);display:grid;place-items:center;margin:0 auto 18px;font-size:25px;font-weight:800}
h1{font-size:25px;letter-spacing:.12em;margin:0}
.sub{color:var(--muted);font-size:12px;letter-spacing:.16em;margin:8px 0 34px}
.panel{border:1px solid var(--line);border-radius:24px;padding:26px 22px;box-shadow:0 12px 40px #18243b0a}
.label{font-size:12px;color:var(--muted);letter-spacing:.12em}
.count{font-size:clamp(52px,15vw,76px);font-weight:750;letter-spacing:-.055em;font-variant-numeric:tabular-nums;margin:8px 0 4px}
.unit{font-size:13px;color:var(--muted)}
.status{display:inline-flex;align-items:center;gap:8px;margin:24px 0 20px;font-size:13px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:#aab0ba}
.running .dot{background:#27b879;box-shadow:0 0 0 5px #27b8791c}
.buttons{display:grid;grid-template-columns:1fr 1fr;gap:12px}
button{border:0;border-radius:15px;min-height:58px;font-size:16px;font-weight:700;touch-action:manipulation}
#start{background:var(--blue);color:#fff}
#stop{background:#f0f2f5;color:#343a44}
button:disabled{opacity:.42}
.settings{display:flex;justify-content:space-between;gap:12px;padding:18px 2px 0;margin-top:18px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.settings strong{color:var(--ink);font-weight:650}
#target{margin-top:20px;width:100%;min-height:62px;background:#f5f7fa;color:#343a44;border:1px dashed #cfd5df}
#target:active{background:#eaf0ff}
.hint{font-size:12px;line-height:1.6;color:var(--muted);margin:18px 4px 0}
footer{margin-top:22px;color:#b0b5be;font-size:10px;letter-spacing:.15em}
</style>
</head>
<body>
<main>
  <div class="mark">R</div>
  <h1>ROD CLICKER</h1>
  <div class="sub">SIMPLE AUTO CLICK TOOL</div>
  <section class="panel" aria-live="polite">
    <div class="label">CLICK COUNT</div>
    <div class="count" id="count">0</div>
    <div class="unit">回</div>
    <div class="status" id="status"><span class="dot"></span><span id="statusText">停止中</span></div>
    <div class="buttons">
      <button id="start">START</button>
      <button id="stop" disabled>STOP</button>
    </div>
    <div class="settings"><span>間隔 <strong>50 ms</strong></span><span>回数 <strong>無制限</strong></span></div>
    <button id="target" type="button">ここを連打テストする</button>
    <p class="hint">STARTすると、このページ内のテストボタンを50ms間隔でクリックします。STOPでいつでも停止できます。</p>
  </section>
  <footer>MADE FOR ROD · IPAD WEB EDITION</footer>
</main>
<script>
(() => {
  const countEl=document.getElementById('count');
  const status=document.getElementById('status');
  const statusText=document.getElementById('statusText');
  const start=document.getElementById('start');
  const stop=document.getElementById('stop');
  const target=document.getElementById('target');
  let timer=null, count=0;
  function render(){
    countEl.textContent=count.toLocaleString('ja-JP');
  }
  function halt(){
    if(timer!==null){clearInterval(timer);timer=null;}
    status.classList.remove('running');
    statusText.textContent='停止中';
    start.disabled=false; stop.disabled=true;
  }
  start.addEventListener('click',()=>{
    if(timer!==null)return;
    status.classList.add('running');
    statusText.textContent='連打中';
    start.disabled=true; stop.disabled=false;
    timer=setInterval(()=>target.click(),50);
  });
  stop.addEventListener('click',halt);
  target.addEventListener('click',()=>{
    count++;
    render();
  });
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden)halt();
  });
  window.addEventListener('pagehide',halt);
})();
</script>
</body>
</html>
